<!-- popup.html -->
<!DOCTYPE html>
<html>
<head>
  <title>Settings</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 15px;
      width: 220px;
    }
    h2 {
      margin-top: 0;
      font-size: 18px;
    }
    .input-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .input-group button {
      padding: 5px;
      font-size: 18px;
      width: 35px;
      height: 35px;
      cursor: pointer;
      border: none;
      background-color: #007bff;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .input-group input[type="number"] {
      width: 60px;
      text-align: center;
      font-size: 16px;
      padding: 5px;
      margin: 0;
      border: 1px solid #ddd;
      border-radius: 5px;
      -moz-appearance: textfield; /* Hides spinner on Firefox */
    }
    /* Hides spinner on Chrome, Safari, Edge, Opera */
    .input-group input[type="number"]::-webkit-outer-spin-button,
    .input-group input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .success-message {
      color: green;
      font-size: 0.9em;
      display: none;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>Scroll Delay Settings</h2>
  <div class="input-group">
    <button id="decreaseButton">-</button>
    <input type="number" id="scrollTimer" min="1" step="1">
    <button id="increaseButton">+</button>
  </div>

    <!-- Visibility Toggle for Buttons -->
    <div class="input-group">
        <input type="checkbox" id="showButtons" />
        <label for="showButtons">Show navigation buttons</label>
    </div>

  <div id="successMessage" class="success-message">Settings saved!</div>
  <script src="popup.js"></script>
</body>
</html>
